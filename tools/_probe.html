<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>htmlpreview probe</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.4/ethers.umd.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      document.body.setAttribute("data-inline", "ran");
      document.body.setAttribute("data-ethers", typeof window.ethers);
      document.body.textContent = "INLINE_RAN ethers=" + (typeof window.ethers) + " keccak=" + (typeof window.keccak256);
    });
  </script>
</head>
<body>NOJS</body>
</html>
